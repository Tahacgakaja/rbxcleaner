name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Gradle Wrapper Manually
        run: |
          gradle init --type basic --automation-language groovy --dsl groovy --test-framework none --project-name rbxcleaner --no-incubating || true

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build APK
        run: ./gradlew assembleRelease || gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
